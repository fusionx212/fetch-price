[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fetch-price"
version = "1.0.0"
description = "Agent-native marketplace for affiliate commerce. Search products across Amazon, eBay, Booking.com, and Expedia."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://fetch-price.com"
Documentation = "https://api.fetch-price.com"
Repository = "https://github.com/fusionx212/fetch-price"
Issues = "https://github.com/fusionx212/fetch-price/issues"

[tool.setuptools.packages.find]
include = ["fetch_price*"]
