[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fetch-price"
version = "1.0.0"
description = "Live UK marketplace product search for AI agents. eBay UK live via Browse API; Amazon UK rolling out. Normalised JSON, affiliate links included."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://fetch-price.com"
Repository = "https://github.com/fusionx212/fetch-price"
